[project]
name = "bpmn-generation-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyyaml>=6,<7",
  "jinja2>=3.1,<4",
  "openai>=1.50,<3",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
  "pysbd==0.3.4",
  "pm4py>=2.7.15,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
evaluation = [
  "sentence-transformers>=3,<6",
  "scipy>=1.10,<2",
  "pulp>=2.8,<4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
